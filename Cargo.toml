[package]
name = "ai-tools"
version = "0.13.1"
edition = "2024"
description = "All-in-one AI tool: permanent memory for AI agents"
repository = "https://github.com/hatimthayyil/ai-tools"
license = "CC0-1.0"
include = ["/src", "/tests", "/LICENSE", "/README.md", "/Cargo.toml", "/Cargo.lock"]

[[bin]]
name = "ai"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
backon = { version = "1.6.0", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false }
getrandom = "0.4.3"
gix = { version = "0.88.0", default-features = false, features = ["anyhow", "index", "sha1"] }
ignore = "0.4.33"
indicatif = "0.18.6"
jiff = { version = "0.2.37", features = ["serde"] }
libc = "0.2.190"
memchr = "2.8.3"
mti = "1.1.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
toml_edit = "0.25.17"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }

[profile.dev.package."*"]
opt-level = 3
