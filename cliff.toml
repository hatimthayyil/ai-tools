[changelog]
header = "# Changelog\n"
body = """

{% if version %}\
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}
{% if commit.breaking_description and commit.breaking_description != commit.message %}
> {{ commit.breaking_description }}

{% endif %}\
{% endfor %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { field = "breaking", pattern = "true", group = "Breaking changes" },
    { field = "id", pattern = "^3198b9de", group = "Features" },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^(docs|chore|refactor|test|build|ci|style)", skip = true },
    { message = ".*", group = "Other changes" },
]
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
